# Build Windows + macOS et publication d'une GitHub Release.
# Déclenché par un tag : git tag v1.1.0 && git push origin v1.1.0
# (ou à la main depuis l'onglet Actions : build seulement, sans release)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-15            # Apple Silicon (arm64)
            label: macOS-AppleSilicon
          - os: macos-15-intel      # Intel (x86_64)
            label: macOS-Intel
    runs-on: ${{ matrix.os }}
    # Le build Intel ne doit jamais bloquer la release Windows / Apple Silicon
    continue-on-error: ${{ matrix.label == 'macOS-Intel' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Auto-test (code source)
        run: python run.py --selftest

      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(python -c 'import whisperqc; print(whisperqc.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Le tag correspond à la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.ver.outputs.v }}" ]; then
            echo "Tag $GITHUB_REF_NAME ≠ __version__ ${{ steps.ver.outputs.v }}"; exit 1
          fi

      - name: PyInstaller
        run: python -m PyInstaller WhisperQC.spec --noconfirm --clean

      - name: Auto-test (app compilée) — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:WHISPERQC_SELFTEST_OUT = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process -FilePath "dist\WhisperQC\WhisperQC.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content $env:WHISPERQC_SELFTEST_OUT
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Auto-test (app compilée) — macOS
        if: runner.os == 'macOS'
        run: |
          export WHISPERQC_SELFTEST_OUT="$RUNNER_TEMP/selftest.txt"
          dist/WhisperQC.app/Contents/MacOS/WhisperQC --selftest || { cat "$WHISPERQC_SELFTEST_OUT"; exit 1; }
          cat "$WHISPERQC_SELFTEST_OUT"

      - name: Paquet Windows (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\WhisperQC -DestinationPath "WhisperQC-${{ steps.ver.outputs.v }}-${{ matrix.label }}.zip"

      - name: Paquet macOS (.dmg)
        if: runner.os == 'macOS'
        run: |
          # PyInstaller signe la .app « ad hoc » (obligatoire sur Apple Silicon).
          # Sans compte développeur Apple, Gatekeeper avertira quand même.
          codesign --verify --deep --strict --verbose=2 dist/WhisperQC.app || echo "::warning::signature ad hoc incomplète"
          mkdir -p dmg && cp -R dist/WhisperQC.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "WhisperQC" -srcfolder dmg -ov -format UDZO \
            "WhisperQC-${{ steps.ver.outputs.v }}-${{ matrix.label }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: WhisperQC-${{ matrix.label }}
          path: |
            WhisperQC-*.zip
            WhisperQC-*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Fichiers trouvés
        run: ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          name: WhisperQC ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: out/*
          draft: true
